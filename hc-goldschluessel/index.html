<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Horse Club – Die goldenen Schlüssel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='22' cy='32' r='14' fill='none' stroke='%23d4a017' stroke-width='7'/%3E%3Crect x='34' y='28' width='26' height='8' rx='2' fill='%23d4a017'/%3E%3Crect x='48' y='36' width='6' height='10' fill='%23d4a017'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6ecd6; --paper:#fffaf0; --ink:#3b2a1a; --muted:#7a6248; --gold:#c8961a; --gold2:#f0c64a;
  --berry:#8c2f39; --green:#2f6b3a; --line:#e2cfa6; --tile:#f3e6c8; --shadow:0 6px 20px rgba(80,50,10,.15);
}
:root[data-theme="dark"]{
  --bg:#1d1712; --paper:#2a221a; --ink:#f3e6cf; --muted:#c2a984; --line:#4a3b2a; --tile:#3a2f22; --shadow:0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.4}
body{overflow-wrap:anywhere;padding:0 14px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:12px 0 6px;position:sticky;top:0;background:var(--bg);z-index:5}
#logo{width:42px;height:42px;flex:none;cursor:pointer;-webkit-user-select:none;user-select:none}
header h1{font-size:18px;margin:0;line-height:1.1}
header small{display:block;color:var(--muted);font-weight:normal;font-size:12px}
#themeBtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;font-size:17px;padding:4px 8px;color:var(--ink)}
.keys{display:flex;gap:6px;margin:2px 0 6px}
.keys span{flex:1;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:3px 0;font-size:20px;opacity:.35;transition:.4s}
.keys span.got{opacity:1;border-style:solid;border-color:var(--gold);background:linear-gradient(135deg,#fff3c4,#f0c64a33);animation:keyIn .6s ease}
.keys span.stolen{opacity:1;border-style:solid;border-color:var(--berry);background:#f7d6d6;animation:shake .4s 3}
@keyframes keyIn{40%{transform:scale(1.25) rotate(-8deg)}}
.mtrack{position:relative;height:70px;margin:0 0 6px}
.mtrack .path{position:absolute;left:4px;right:52px;top:58px;border-top:3px dashed var(--line)}
.mtrack .chest{position:absolute;right:0;top:20px;width:60px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.mtrack .mm{position:absolute;bottom:2px;width:44px;height:68px;transform:translateX(-50%);transition:left 1.6s cubic-bezier(.4,.1,.3,1)}
.mtrack .mm svg{width:100%;height:100%;transform-origin:50% 100%}
.mtrack .mm.walk svg{animation:mwalk .5s ease-in-out infinite alternate}
.mtrack .mm.grab svg{animation:mgrab .35s ease-in-out infinite alternate}
.mtrack .mm.fallen svg{transform:rotate(-90deg) translate(-8px,-6px);transition:transform .8s ease .6s}
.mtrack .arm-grab{display:none}.mtrack .mm.grab .arm-grab{display:inline}.mtrack .mm.grab .arm-walk{display:none}
@keyframes mwalk{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-2px)}}
@keyframes mgrab{from{transform:translateX(0)}to{transform:translateX(3px) rotate(3deg)}}
.prf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.prf b{font-size:16px;color:var(--berry)}
:root[data-theme="dark"] .prf b{color:var(--gold2)}
.shoes{display:flex;gap:3px;font-size:22px}
.shoes span{opacity:.25;filter:grayscale(1);transition:.4s}
.shoes span.on{opacity:1;filter:none;animation:keyIn .6s ease}
.reveal{position:relative;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#9cbf7d,#4f7a3a);display:grid;place-items:center;text-align:center;color:#fff;margin-bottom:6px}
.reveal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reveal .rt{position:relative;font-size:22px;font-weight:bold;text-shadow:0 2px 6px rgba(0,0,0,.6);padding:0 10px}
.reveal .cov{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.reveal .cov i{background:repeating-linear-gradient(45deg,#c8961a,#c8961a 10px,#d9a92a 10px,#d9a92a 20px);border-right:2px solid #8a6510;display:grid;place-items:center;font-style:normal;font-size:24px;color:#6b4a08;transition:transform .7s ease,opacity .7s}
.reveal .cov i.gone{opacity:0;transform:translateY(-110%) rotate(-10deg)}
.why{font-size:14px;color:var(--muted);text-align:center;margin:0 0 8px}
.q{font-size:19px;font-weight:bold;margin:8px 0 2px}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.tiles.pics .tile{padding:4px}
video.lauf{display:block;width:100%;max-width:300px;margin:0 auto;border-radius:12px;background:#fff}
.rolebar{display:flex;gap:4px;margin:0 0 4px;font-size:11px}
.rolebar span{flex:1;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rolebar b{display:flex;align-items:center;justify-content:center;gap:3px;font-size:12.5px;overflow:hidden}
.pav{font-style:normal;line-height:1;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;background:var(--tile);border:2px solid var(--gold);vertical-align:middle}
.pav img{width:100%;height:100%;object-fit:cover}
.nrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.nrow input[type=text]{margin:0}
.camb{position:relative;width:64px;height:64px;flex:none;border-radius:50%;border:0;padding:0;background:none}
.camb .pav{width:64px;height:64px;font-size:28px}
.camb>i:not(.pav){position:absolute;right:-2px;bottom:-2px;font-style:normal;font-size:16px;background:var(--paper);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:var(--shadow)}
.names .hm{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .5s ease both}
.names .hm .pav{width:72px;height:72px;font-size:32px;border-width:3px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--shadow);animation:pop .45s ease both}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ttl{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.ttl .ic{font-size:34px;line-height:1}
.ttl h2{margin:0;font-size:22px;color:var(--berry);line-height:1.15}
:root[data-theme="dark"] .ttl h2{color:var(--gold2)}
.sub{color:var(--muted);font-size:15px;margin:0 0 6px}
button{font-family:inherit}
button.big{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:16px;font-size:20px;font-weight:bold;color:#3b2a1a;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 4px 0 #8a6510}
button.big:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6510}
button.big.pulse{animation:btnPulse 1.6s ease-in-out infinite}
@keyframes btnPulse{50%{box-shadow:0 4px 0 #8a6510,0 0 0 8px rgba(240,198,74,.35)}}
button.sec{background:var(--bg);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:16px;padding:11px}
input[type=text],input[type=number],textarea{width:100%;font-size:18px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;margin:4px 0}
/* Sprachnachricht */
.vc{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:8px;margin:8px 0;border:2px solid transparent;transition:border-color .3s}
.vc.playing{border-color:var(--green)}
.vc.wait{animation:vcWait 1.2s ease-in-out infinite}
@keyframes vcWait{50%{border-color:var(--gold2);transform:scale(1.02)}}
.vc .av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;border:3px solid var(--gold);background:var(--paper)}
.vc .mid{flex:1;min-width:0}
.vc .who{font-size:13px;font-weight:bold;color:var(--muted)}
.wave{display:flex;align-items:center;gap:3px;height:28px}
.wave i{flex:1;background:var(--green);border-radius:3px;opacity:.55;transform-origin:center}
.vc.playing .wave i{animation:wv .8s ease-in-out infinite;opacity:1}
@keyframes wv{50%{transform:scaleY(.3)}}
.vc .play{display:flex;align-items:center;justify-content:center;padding:0;width:58px;height:58px;border-radius:50%;border:0;flex:none;font-size:24px;color:#3b2a1a;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 3px 0 #8a6510}
details.vt{font-size:14px;color:var(--muted);margin:-2px 4px 6px}
details.vt summary{cursor:pointer;list-style:none;font-size:13px}
details.vt summary::-webkit-details-marker{display:none}
/* Radar */
.radar{text-align:center;padding:4px 0;-webkit-user-select:none;user-select:none}
.radar .ring{width:170px;height:170px;margin:4px auto;border-radius:50%;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle,var(--paper) 42%,transparent 43%),conic-gradient(from 0deg,#5aa0e0,#e8a33d,#d9412b,#5aa0e0);animation:spin 6s linear infinite}
.radar .ring.off{background:radial-gradient(circle,var(--paper) 42%,transparent 43%),repeating-conic-gradient(#bbb 0 10deg,#888 10deg 20deg);animation:spin 1.5s steps(6) infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.radar .dist{font-size:54px;font-weight:bold;line-height:1}
.radar .temp{font-size:26px;margin-top:4px;font-weight:bold}
.radar .trend{font-size:30px;min-height:36px}
.note{font-size:13px;color:var(--muted)}
/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{border:2.5px solid var(--line);background:var(--tile);color:var(--ink);border-radius:16px;padding:10px 4px;font-size:18px;font-weight:bold;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,border-color .2s,background .2s}
.tile:active{transform:scale(.95)}
.tile .em{font-size:38px;line-height:1.1}
.tile small{font-size:13px;font-weight:normal}
.tile.ok{border-color:var(--green);background:#d9f0dc;color:#1d3d22;animation:okPop .4s ease}
.tile.no{border-color:var(--berry);animation:shake .4s}
.tile.dim{opacity:.35}
.tile svg{width:100%;max-width:120px;height:auto}
@keyframes okPop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .4s}
/* Geheimschrift */
.slots{display:flex;justify-content:center;gap:6px;margin:8px 0}
.slot{width:44px;text-align:center}
.slot .e{font-size:32px;display:block}
.slot .l{display:block;height:40px;border-bottom:3px solid var(--gold);font-size:28px;font-weight:bold;line-height:40px}
.slot.cur .l{border-color:var(--berry);animation:blink 1s infinite}
@keyframes blink{50%{border-color:transparent}}
.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0}
.legend div{background:var(--bg);border-radius:10px;text-align:center;padding:2px 0;font-size:22px;line-height:1.15}
.legend b{display:block;font-size:15px}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.kb button{padding:10px 0;border-radius:10px;border:2px solid var(--line);background:var(--tile);color:var(--ink);font-size:20px;font-weight:bold}
.kb button:active{transform:scale(.92)}
/* Bilder */
.hintimg{width:100%;border-radius:14px;margin-top:8px;max-height:46vh;object-fit:cover}
.hint{font-size:21px;font-weight:bold;text-align:center;margin:8px 0}
.bigem{font-size:70px;text-align:center;line-height:1.1;margin:6px 0}
.horse{display:block;margin:0 auto;width:72%;max-width:260px}
.horse.run{animation:bob .45s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.alarm{border:3px solid var(--berry);animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 0 10px rgba(140,47,57,.25);background:#f9e1e1}}
:root[data-theme="dark"] .alarm{animation:alarmD 1s ease-in-out infinite}
@keyframes alarmD{50%{box-shadow:0 0 0 10px rgba(200,60,60,.3);background:#3a1f1f}}
.bubble{background:var(--bg);border-radius:6px 18px 18px 18px;padding:12px;font-size:19px;margin:6px 0}
.steps3 .tile{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px;text-align:left;font-size:19px}
.steps3{display:grid;gap:8px;margin-top:10px}
.locks{display:flex;justify-content:space-around;margin:14px 0}
.locks button{background:none;border:0;padding:0}
.locks svg{width:84px;height:110px}
.locks .sh{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.locks button.open .sh{transform:translateY(-14px) rotate(-18deg);transform-origin:70% 100%}
.names{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.names .hm span{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3b2a1a;border-radius:20px;padding:6px 14px;font-weight:bold}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#admin{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;overflow:auto;padding:20px 16px}
#admin .card{margin:0 auto;max-width:520px;animation:none}
#admin h3{margin:16px 0 4px;font-size:17px}
#admin label{font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.ok-txt{color:var(--green);font-weight:bold}
.bad-txt{color:var(--berry);font-weight:bold}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <svg id="logo" viewBox="0 0 64 64" aria-label="Horse Club"><circle cx="32" cy="32" r="30" fill="#8c2f39"/><path d="M20 46 C18 30 22 22 30 16 L34 12 L36 18 C44 20 48 28 46 36 L40 34 L38 46 Z" fill="#f0c64a"/><circle cx="37" cy="24" r="2" fill="#8c2f39"/></svg>
  <h1>Horse Club<small>Die goldenen Schlüssel</small></h1>
  <button id="themeBtn" aria-label="Hell/Dunkel">🌙</button>
</header>
<div class="keys"><span id="k1">🔑</span><span id="k2">🔑</span><span id="k3">🔑</span></div>
<div class="mtrack" id="mtrack" hidden><div class="path"></div><img class="chest" src="img/truhe.png" alt="Truhe"><div class="mm walk" id="mm"></div></div>
<div class="rolebar" id="rolebar" hidden></div>
<main id="app"></main>
<canvas id="confetti"></canvas>
<div id="admin"><div class="card" id="adminCard"></div></div>

<script>
"use strict";
/* ============ Speicher ============ */
const LS_CFG="hc_cfg_v2", LS_ST="hc_state_v2", PIN="7531";
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alertBox("Speichern fehlgeschlagen (Speicher voll?)")}}
};
const PKEYS=["eingang","huegel","spinne","baum","home"];
const DEFAULT_CFG={
  radius:30,
  word:"WURZEL",
  chestPlace:"im großen Baum am Teich",
  bday:"",
  points:{
    eingang:{name:"Großer Baum am Parkeingang",icon:"🌳",lat:null,lon:null,hint:"Zwischen den Wurzeln!",photo:null},
    huegel:{name:"Der Hügel",icon:"⛰️",lat:null,lon:null,hint:"Ganz oben …",photo:null},
    spinne:{name:"Die Kletterspinne",icon:"🕸️",lat:null,lon:null,hint:"Ganz oben im Netz!",photo:null},
    baum:{name:"Großer Baum am Teich",icon:"🌳",lat:null,lon:null,hint:"Schaut nach oben!",photo:null},
    home:{name:"Hauptquartier (zu Hause)",icon:"🏠",lat:null,lon:null,hint:"",photo:null}
  }
};
function loadCfg(){
  let c=store.get(LS_CFG,null);
  if(!c){ // Übernahme aus der ersten Fassung (Hügel, Zuhause, Radius, Geburtstagskind)
    const o=store.get("hc_cfg_v1",null);c={};
    if(o){c.radius=o.radius;c.bday=o.bday;c.points={};
      if(o.points&&o.points.huegel&&o.points.huegel.lat!=null)c.points.huegel={lat:o.points.huegel.lat,lon:o.points.huegel.lon,photo:o.points.huegel.photo||null};
      if(o.points&&o.points.home&&o.points.home.lat!=null)c.points.home={lat:o.points.home.lat,lon:o.points.home.lon}}
  }
  const r=Object.assign({},DEFAULT_CFG,c);r.points={};
  for(const k of PKEYS)r.points[k]=Object.assign({},DEFAULT_CFG.points[k],(c.points||{})[k]||{});
  return r;
}
let cfg=loadCfg();
const ST0=()=>({step:0,names:[],keys:[0,0,0],quiz:0,heard:{},d0:null});
let st=Object.assign(ST0(),store.get(LS_ST,{}));
const saveCfg=()=>store.set(LS_CFG,cfg), saveSt=()=>store.set(LS_ST,st);
let pics=store.get("hc_pics_v2",[null,null,null,null]);const savePics=()=>store.set("hc_pics_v2",pics);

/* Import der Einrichtung per Link: …/#cfg=… */
(function(){
  const m=location.hash.match(/cfg=([^&]+)/);
  if(!m)return;
  try{
    const imp=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    for(const k of ["radius","word","chestPlace","bday"]) if(imp[k]!==undefined) cfg[k]=imp[k];
    if(imp.points) for(const p in imp.points){if(!cfg.points[p])continue;cfg.points[p]=Object.assign({},cfg.points[p],imp.points[p],{photo:cfg.points[p].photo||null})}
    saveCfg();
    history.replaceState(null,"",location.pathname);
    setTimeout(()=>alertBox("Einrichtung übernommen ✔"),300);
  }catch(e){setTimeout(()=>alertBox("Einrichtungs-Link konnte nicht gelesen werden."),300)}
})();

/* ============ Hilfen ============ */
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NP=4;
const N=i=>esc(st.names[i]||"Mädchen "+(i+1));
const HEARTS=["🧡","💗","💙","💜"];
function av(i,px){return `<i class="pav" style="width:${px}px;height:${px}px;font-size:${Math.round(px*.5)}px">${pics[i]?`<img src="${pics[i]}" alt="">`:HEARTS[i]}</i>`}
/* Foto quadratisch zuschneiden und verkleinern (nur auf diesem Handy gespeichert) */
function takePic(file,cb){const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=Math.min(img.width,img.height),cv=document.createElement("canvas");cv.width=cv.height=240;
  cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,240,240);URL.revokeObjectURL(u);cb(cv.toDataURL("image/jpeg",.75))};img.src=u}
function beep(f=880,d=.15){try{const a=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*160))}
const okSnd=()=>beep(990), noSnd=()=>beep(220,.3);
function alertBox(t){const d=document.createElement("div");d.className="card";d.style.cssText="position:fixed;left:16px;right:16px;bottom:20px;z-index:60";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function go(step){st.step=step;saveSt();render();window.scrollTo({top:0,behavior:"smooth"})}
function shake(el){el.classList.remove("no","shake");void el.offsetWidth;el.classList.add(el.classList.contains("tile")?"no":"shake")}
const ttl=(ic,h)=>`<div class="ttl"><span class="ic">${ic}</span><h2>${h}</h2></div>`;

/* Schlüssel: 0 fehlt, 1 da, 2 geklaut */
function updKeys(){st.keys.forEach((k,i)=>{const e=$("#k"+(i+1));e.className=k===1?"got":k===2?"stolen":"";e.textContent=k===2?"❓":"🔑"})}
function gotKey(i){st.keys[i]=1;saveSt();updKeys();fanfare()}

/* Plan-Balken je Schritt */
/* Mr. Michaels läuft je Schritt zur Truhe (Position in %), greift ab 85 %, fällt beim Sieg um */
const PLAN=[0,12,22,28,34,40,46,56,62,70,96,96,60,50,35,20,8,4];
const MM_SVG=`<svg viewBox="0 0 44 64" aria-label="Mr. Michaels">

function setPlaying(id,on){document.querySelectorAll(`.vc[data-v="${id}"]`).forEach(e=>{e.classList.toggle("playing",on);if(on)e.classList.remove("wait");const b=e.querySelector(".play");if(b)b.innerHTML=on?PAUSE_I:PLAY_I})}
function stopV(){tok++;try{AU.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}if(curV)setPlaying(curV,false);curV=null}
function tts(id,my){
  if(my!==tok)return;
  if(!("speechSynthesis" in window)){setPlaying(id,false);curV=null;return}
  const u=new SpeechSynthesisUtterance(VOICES[id].t);u.lang="de-DE";u.rate=1;
  const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));if(vs.length)u.voice=vs.find(v=>/Anna|Helena|Petra/i.test(v.name))||vs[0];
  u.onend=()=>{if(my===tok){setPlaying(id,false);curV=null}};
  speechSynthesis.speak(u);
}
function playV(id){
  stopV();const my=tok,v=VOICES[id];curV=id;st.heard[id]=true;saveSt();setPlaying(id,true);
  let fell=false;const fb=()=>{if(fell||my!==tok)return;fell=true;tts(id,my)};
  AU.onerror=fb;AU.onended=()=>{if(my===tok){setPlaying(id,false);curV=null}};
  AU.src="audio/"+v.f;
  const p=AU.play();
  if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){setPlaying(id,false);curV=null;document.querySelectorAll(`.vc[data-v="${id}"]`).forEach(x=>x.classList.add("wait"))}else fb()});
}

let watchId=null,lastDist=null,onArrive=null,wake=null;
function haversine(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180;const dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function tempWord(d){if(d<=cfg.radius)return["🔥 Da!","#d9412b"];if(d<60)return["🔥 Glühend","#d9412b"];if(d<120)return["☀️ Heiß","#e8743d"];if(d<220)return["🌤️ Warm","#e8a33d"];if(d<400)return["🌥️ Kalt","#6aa0d0"];return["❄️ Eiskalt","#3c78c0"]}
async function keepAwake(){try{if("wakeLock" in navigator){wake=await navigator.wakeLock.request("screen")}}catch(e){}}
function stopRadar(){if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function arrive(){if(!onArrive)return;const cb=onArrive;onArrive=null;stopRadar();fanfare();cb()}
/* radar(pointKey, next, {top, onDist}) */
function radar(pk,next,o={}){
  const p=cfg.points[pk];
  app.innerHTML=`<div class="card">${ttl(p.icon,esc(p.name))}${o.top||""}
  <div class="radar" id="radar"><div class="ring">🧭</div><div id="radarInfo"><div class="note">GPS …</div></div></div></div>`;
  let t=null;const r=$("#radar");
  const down=()=>{t=setTimeout(arrive,2000)},up=()=>clearTimeout(t);
  r.addEventListener("touchstart",down,{passive:true});r.addEventListener("touchend",up);r.addEventListener("mousedown",down);r.addEventListener("mouseup",up);
  stopRadar();onArrive=next;lastDist=null;keepAwake();
  const info=$("#radarInfo");
  if(p.lat==null){info.innerHTML=`<div class="note">Ort noch nicht gespeichert.<br>Spielleiter: 2 s auf den Kreis drücken.</div>`;return}
  if(!("geolocation" in navigator)){info.innerHTML=`<div class="note">Kein GPS. Spielleiter: 2 s auf den Kreis drücken.</div>`;return}
  watchId=navigator.geolocation.watchPosition(pos=>{
    const d=Math.round(haversine(pos.coords.latitude,pos.coords.longitude,p.lat,p.lon));
    const [w,col]=tempWord(d);const el=$("#radarInfo");if(!el)return;
    let tr="";if(lastDist!=null){if(d<lastDist-4)tr="👍";else if(d>lastDist+4)tr="👎";}
    lastDist=d;
    el.innerHTML=`<div class="dist">${d} m</div><div class="temp" style="color:${col}">${w}</div><div class="trend">${tr}</div><div class="note">± ${Math.round(pos.coords.accuracy)} m</div>`;
    if(o.onDist)o.onDist(d);
    if(d<=cfg.radius)arrive();
  },err=>{const el=$("#radarInfo");if(el)el.innerHTML=`<div class="note">GPS: ${esc(err.message)}<br>Safari → Standort erlauben, oder Spielleiter: 2 s auf den Kreis.</div>`},
  {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}

  if(i>=QUIZ.length){
    app.innerHTML=`<div class="card">${prfHead()}${revealBox(true)}<p class="why">Bestanden! Das ist das Versteck.</p>
    <button class="big pulse" id="b">🔑 Schlüssel 2 gefunden!</button></div>`;
    $("#b").onclick=()=>{gotKey(1);go(7)};return;
  }
  const q=QUIZ[i],multi=q.multi||1;let hits=0;
  app.innerHTML=`<div class="card">${prfHead()}${revealBox(false)}
  <p class="why">Jede richtige Antwort zeigt ein Stück vom Versteck!</p>
  <div class="q">${i+1}. ${q.q}</div>${multi>1?`<p class="note">${multi} Antworten sind richtig</p>`:""}${q.pic||""}
  <div class="tiles ${q.cls||""}">${q.tiles.map((t,j)=>`<button class="tile" data-j="${j}">${t[0]}</button>`).join("")}</div></div>`;
  if(qGone>=0){const c=app.querySelector(`.cov i[data-c="${qGone}"]`);qGone=-1;if(c)requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add("gone")))}
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("ok"))return;
    if(q.tiles[+b.dataset.j][1]){b.classList.add("ok");okSnd();
      if(++hits>=multi){app.querySelectorAll(".tile:not(.ok)").forEach(x=>x.classList.add("dim"));
        setTimeout(()=>{qGone=i;st.quiz=i+1;saveSt();if(st.quiz>=QUIZ.length)fanfare();render()},800)}}
    else{noSnd();shake(b)}
  });
};
// 7 Sichtung: ein Spion beobachtet sie (ohne Ton)
steps[7]=()=>{
  app.innerHTML=`<div class="card alarm">${ttl("👀","Da hinten!")}<div class="bigem">🕵️</div>
  <p class="sub" style="text-align:center">Ein Spion von Mr. Michaels?<br><b>Passt auf eure Schlüssel auf!</b></p>
  <button class="big" id="b">Weiter</button></div>`;
  $("#b").onclick=()=>go(8);
};
// 8 Zeichen am Schlüssel
steps[8]=()=>{
  app.innerHTML=`<div class="card">${ttl("🔍","Was hängt am Schlüssel?")}<div class="bigem">🔑❓</div>
  <div class="tiles two">${["huf","baum","spinne","welle"].map(k=>`<button class="tile" data-k="${k}">${SYM[k]}</button>`).join("")}</div></div>`;
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(b.dataset.k==="spinne"){b.classList.add("ok");okSnd();app.querySelectorAll(".tile:not(.ok)").forEach(x=>x.classList.add("dim"));st.d0=null;setTimeout(()=>go(9),900)}
    else{noSnd();shake(b)}
  });
};
// 9 Radar Spinne
steps[9]=()=>radar("spinne",()=>{st.keys[2]=2;saveSt();go(10);playV("v3")});
// 10 Der Spion hat Schlüssel 3: hinterher!
steps[10]=()=>{
  if(st.keys[2]!==2){st.keys[2]=2;saveSt();updKeys()}
  app.innerHTML=`<div class="card alarm">${ttl("🚨","Der Spion hat Schlüssel 3!")}${voiceCard("v3")}
  <div class="bigem">🕵️💨🔑</div><p class="sub" style="text-align:center"><b>Hinterher!</b></p>
  <button class="big" id="b">✋ Eingeholt!</button></div>`;
  $("#b").onclick=()=>go(11);
};
// 11 Er ist verletzt: helfen?
steps[11]=()=>{
  app.innerHTML=`<div class="card">${ttl("🤕","Aua, sein Knie!")}
  <div class="tiles two" id="ch"><button class="tile" data-c="weg"><span class="em">🏃‍♀️💨</span>Wegrennen</button><button class="tile" data-c="hilf"><span class="em">❤️</span>Helfen</button></div>
  <div id="help"></div></div>`;
  app.querySelectorAll("#ch .tile").forEach(b=>b.onclick=()=>{
    if(b.dataset.c==="weg"){noSnd();shake(b);alertBox("🐴 Der Horse Club lässt niemanden liegen!");return}
    b.classList.add("ok");okSnd();app.querySelector('[data-c="weg"]').classList.add("dim");
    let n=0;
    $("#help").innerHTML=`<div class="tiles" style="margin-top:14px">${[["💬","Geht’s?"],["🩹","Pflaster"],["🤝","Aufhelfen"]].map(x=>`<button class="tile"><span class="em">${x[0]}</span><small>${x[1]}</small></button>`).join("")}</div>`;
    $("#help").querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(t.classList.contains("ok"))return;t.classList.add("ok");okSnd();if(++n>=3){go(12);playV("v8")}});
  });
};
// 12 Seitenwechsel: Schlüssel zurück, Versteck verraten
steps[12]=()=>{
  if(st.keys[2]!==1){gotKey(2)}
  app.innerHTML=`<div class="card">${ttl("🤝","Ein neuer Freund")}${voiceCard("v8")}
  <div class="bigem">🌳📦</div><button class="big pulse" id="b">Los zum Teich! 🏃‍♀️</button></div>`;
  $("#b").onclick=()=>{st.d0=null;go(13);playV("v4")};
};
// 13 Radar Teichbaum (Sarah)
steps[13]=()=>radar("baum",()=>go(14),{top:voiceCard("v4")});
// 14 Truhe herunterlassen
steps[14]=()=>{
  const S=[["🪢","Knoten lösen"],["✋","Festhalten"],["⬇️","Langsam runter"]];let n=0;
  app.innerHTML=`<div class="card">${ttl("📦","Da oben!")}<div class="steps3">${S.map((x,i)=>`<button class="tile${i?" dim":""}" data-i="${i}"><span class="em">${x[0]}</span>${i+1}. ${x[1]}</button>`).join("")}</div>
  <button class="big" id="b" style="display:none">📦 Truhe gesichert!</button></div>`;
  app.querySelectorAll(".steps3 .tile").forEach(t=>t.onclick=()=>{
    if(+t.dataset.i!==n){noSnd();shake(t);return}
    t.classList.remove("dim");t.classList.add("ok");okSnd();n++;
    const nx=app.querySelector(`.steps3 .tile[data-i="${n}"]`);if(nx)nx.classList.remove("dim");
    if(n>=3){const b=$("#b");b.style.display="block";b.classList.add("pulse")}
  });
  $("#b").onclick=()=>{st.d0=null;go(15);playV("v5")};
};
// 15 Heimweg (Sophia, dann Mr. Michaels unterwegs)
steps[15]=()=>{
  if(cfg.points.home.lat==null){
    app.innerHTML=`<div class="card">${ttl("🏠","Ab ins Hauptquartier!")}${voiceCard("v5")}${voiceCard("v6")}<button class="big" id="b">🏠 Wir sind zu Hause!</button></div>`;
    $("#b").onclick=()=>go(16);return;
  }
  radar("home",()=>go(16),{top:voiceCard("v5")+voiceCard("v6"),onDist:walkTrigger("v6",120)});
};
// 16 Finale: drei Schlösser
steps[16]=()=>{
  const L=[["#7a4fc2",0],["#c62828",1],["#11998e",0]];let n=0;
  app.innerHTML=`<div class="card">${ttl("🔐","Drei Schlüssel, drei Schlösser")}
  <div class="locks">${L.map((x,i)=>`<button data-i="${i}">${lockSVG(x[0],x[1])}</button>`).join("")}</div>
  <p class="note" style="text-align:center">Schloss offen? Antippen!</p></div>`;
  app.querySelectorAll(".locks button").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("open"))return;b.classList.add("open");okSnd();
    if(++n>=3){fanfare();playV("v7");setTimeout(()=>go(17),900)}
  });
};
// 17 Sieg
steps[17]=()=>{
  app.innerHTML=`<div class="card">${ttl("🏆","Wald gerettet!")}${voiceCard("v7")}
  <div class="bigem">🐴🐴🐴🐴</div><p class="sub" style="text-align:center">Ehrenmitglieder im Horse Club:</p>
  <div class="names">${[0,1,2,3].map(i=>`<div class="hm" style="animation-delay:${i*.25}s">${av(i,72)}<span>${N(i)}</span></div>`).join("")}</div>
  ${cfg.bday?`<p style="text-align:center;font-size:22px">🎂 <b>Alles Gute, ${esc(cfg.bday)}!</b> 🎂</p>`:""}</div>`;
  confetti();
};
const STEPNAMES=["Namen","Hilferuf (V1)","→ Parkeingang (V2)","Geheimschrift","Schlüssel 1","→ Hügel","Pferdekennerinnen-Prüfung + Schlüssel 2","Spion gesichtet","Zeichen am Schlüssel","→ Spinne","Spion hat Schlüssel 3 (V3)","Verletzt: helfen","Seitenwechsel (V8)","→ Teichbaum (V4)","Truhe runterlassen","→ Zuhause (V5, V6)","Schlösser öffnen","Sieg (V7)"];
const LAST=STEPNAMES.length-1;
function keysFor(s){return [s>=5?1:0,s>=7?1:0,s>=10?(s<=11?2:1):0]}

/* ============ Konfetti ============ */
function confetti(){
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,v:2+Math.random()*3,a:Math.random()*6,c:["#f0c64a","#8c2f39","#2f6b3a","#d77fa1","#5aa0e0"][Math.floor(Math.random()*5)]}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.fillRect(p.x+Math.sin(p.a)*8,p.y,p.r,p.r*1.6)});if(++n<480)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

/* ============ Spielleiter-Menü (5× auf das Logo tippen) ============ */
let taps=0,tapT=null;
$("#logo").addEventListener("click",()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);if(taps>=5){taps=0;openAdmin(false)}});
function openAdmin(unlocked){
  const A=$("#admin"),C=$("#adminCard");A.style.display="block";stopRadar();
  if(!unlocked){
    C.innerHTML=`<h2>🔒 Spielleiter</h2><input type="number" id="pin" placeholder="PIN" inputmode="numeric"><button class="big" id="pinOk">Öffnen</button><button class="big sec" id="close">Schließen</button>`;
    $("#pinOk").onclick=()=>{if($("#pin").value===PIN)openAdmin(true);else alertBox("Falsche PIN")};
    $("#close").onclick=closeAdmin;return;
  }
  const pt=k=>{const p=cfg.points[k];return `<h3>${p.icon} ${esc(p.name)}</h3>
    <div class="note" id="pos_${k}">${p.lat!=null?`gespeichert: ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`:"noch keine Position"}</div>
    <button class="big sec" data-save="${k}">📍 Aktuelle Position hier speichern</button>
    ${k!=="home"?`<label>Hinweis nach dem Rätsel (kurz!)</label><input type="text" id="hint_${k}" value="${esc(p.hint)}">
    <label>Foto vom Versteck (optional, nur auf diesem Handy)</label><input type="file" accept="image/*" data-photo="${k}">
    ${p.photo?`<img class="hintimg" src="${p.photo}" style="max-height:120px">`:""}`:""}`};
  C.innerHTML=`<h2>🛠️ Spielleiter</h2>
  <p class="note">Schritt ${st.step}: ${STEPNAMES[st.step]||""}</p>
  <div class="row"><button class="big sec" id="prev">◀ Zurück</button><button class="big sec" id="next">Weiter ▶</button></div>
  <h3>🔊 Ton testen</h3><div class="row">${Object.keys(VOICES).map(v=>`<button class="big sec" data-play="${v}" style="padding:8px 0">${v.slice(1)}</button>`).join("")}</div>
  <h3>🔤 Geheimwort Station 1</h3><input type="text" id="word" value="${esc(cfg.word)}">
  <h3>📦 Satz des Spions: Die Truhe hängt …</h3><input type="text" id="chest" value="${esc(cfg.chestPlace)}">
  <h3>🎂 Geburtstagskind (Schlussseite)</h3><input type="text" id="bday" value="${esc(cfg.bday||"")}">
  <h3>🎯 Ankunfts-Radius (Meter)</h3><input type="number" id="rad" value="${cfg.radius}">
  ${PKEYS.map(pt).join("")}
  <button class="big" id="saveAll">💾 Alles speichern</button>
  <h3>🔗 Einrichtung auf anderes Handy übertragen</h3><p class="note">Link mit Positionen und Texten (ohne Fotos).</p>
  <button class="big sec" id="exp">Link kopieren</button><textarea id="expOut" rows="3" readonly style="display:none"></textarea>
  <h3>⚠️ Spiel</h3><button class="big sec" id="reset">Spiel zurücksetzen (Einrichtung bleibt)</button>
  <button class="big sec" id="close">Schließen</button>`;
  const collect=()=>{cfg.word=norm($("#word").value)||"WURZEL";cfg.chestPlace=$("#chest").value.trim()||DEFAULT_CFG.chestPlace;cfg.radius=Math.max(10,+$("#rad").value||30);cfg.bday=$("#bday").value.trim();
    for(const k of PKEYS){const h=$("#hint_"+k);if(h)cfg.points[k].hint=h.value}saveCfg()};
  C.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.save;$("#pos_"+k).textContent="Suche GPS … (bitte kurz stillstehen)";
    let best=null,cnt=0;
    const id=navigator.geolocation.watchPosition(p=>{cnt++;if(!best||p.coords.accuracy<best.coords.accuracy)best=p;
      $("#pos_"+k).textContent=`Messung ${cnt}: ± ${Math.round(p.coords.accuracy)} m`;
      if(cnt>=6||best.coords.accuracy<8){navigator.geolocation.clearWatch(id);cfg.points[k].lat=best.coords.latitude;cfg.points[k].lon=best.coords.longitude;collect();
        $("#pos_"+k).innerHTML=`<span class="ok-txt">✔ gespeichert (± ${Math.round(best.coords.accuracy)} m)</span>`;beep(990)}},
      e=>{$("#pos_"+k).innerHTML=`<span class="bad-txt">GPS-Fehler: ${esc(e.message)}. iPhone: Einstellungen → Datenschutz → Ortungsdienste → Safari-Websites → „Beim Verwenden“ + Genauer Standort.</span>`},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  });
  C.querySelectorAll("[data-photo]").forEach(inp=>inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;const img=new Image();const u=URL.createObjectURL(f);
    img.onload=()=>{const s=Math.min(1,700/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=img.width*s;cv.height=img.height*s;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      collect();cfg.points[inp.dataset.photo].photo=cv.toDataURL("image/jpeg",.7);saveCfg();URL.revokeObjectURL(u);alertBox("Foto gespeichert ✔");openAdmin(true)};img.src=u;
  });
  const setStep=s=>{collect();stopV();st.step=Math.max(0,Math.min(LAST,s));st.keys=keysFor(st.step);if(st.step!==6)st.quiz=0;st.d0=null;saveSt();updKeys();openAdmin(true)};
  $("#saveAll").onclick=()=>{collect();alertBox("Gespeichert ✔")};
  $("#prev").onclick=()=>setStep(st.step-1);
  $("#next").onclick=()=>setStep(st.step+1);
  $("#exp").onclick=async()=>{collect();const o={bday:cfg.bday,radius:cfg.radius,word:cfg.word,chestPlace:cfg.chestPlace,points:{}};
    for(const k of PKEYS){const p=cfg.points[k];o.points[k]={lat:p.lat,lon:p.lon,hint:p.hint}}
    const link=location.origin+location.pathname+"#cfg="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o)))));
    const t=$("#expOut");t.style.display="block";t.value=link;t.select();
    try{await navigator.clipboard.writeText(link);alertBox("Link kopiert ✔")}catch(e){alertBox("Link markiert, bitte manuell kopieren")}};
  $("#reset").onclick=()=>{stopV();st=ST0();saveSt();pics=[null,null,null,null];savePics();updKeys();alertBox("Spiel zurückgesetzt")};
  $("#close").onclick=()=>{collect();closeAdmin()};
}
function closeAdmin(){$("#admin").style.display="none";render()}

/* ============ Theme ============ */
function setTheme(t){document.documentElement.dataset.theme=t;$("#themeBtn").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("hc_theme",t)}catch(e){}}
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
try{setTheme(localStorage.getItem("hc_theme")||"light")}catch(e){setTheme("light")}

/* ============ Start ============ */
function render(){stopRadar();if(st.step>LAST)st.step=0;updKeys();mtrack();rolebar();(steps[st.step]||steps[0])();
  for(const id in VOICES)if(curV===id)setPlaying(id,true)}
render();
</script>
</body>
</html>
